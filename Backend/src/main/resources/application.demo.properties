spring.application.name=vidyasahay-Backend

# Root folder for uploaded student documents
# This path is relative to the application's working directory
app.document.storage-dir=src/main/resources/uploads/documents

#Client URLs
app.cors.allowed-origins=FRONTEND_URL

# PostgreSQL database configuration
spring.datasource.url=YOUR_POSTGRES_CONNECTION_URL
spring.datasource.username=DB_USERNAME
spring.datasource.password=DB_PASSWORD

# Validate the database schema against entity classes
spring.jpa.hibernate.ddl-auto=validate

# Default PostgreSQL schema
spring.jpa.properties.hibernate.default_schema=DB_SCHEMA WHERE THE TABLES ARE THERE OR SHOULD BE CREATEAD

# Print executed SQL queries in the console
spring.jpa.show-sql=true

# JWT configuration
security.jwt.secret=JWT_SECRET_KEY
security.jwt.expiration-ms=TIME IN MS TILL WHEN THE TOKEN WILL BE VALID


# save file in local storage 
app.file.upload-dir=uploads/application-documents

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
