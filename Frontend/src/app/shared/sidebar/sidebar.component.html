<aside class="sidebar" [class.sidebar-open]="isOpen">
  <div class="sidebar-mobile-header">
    <div class="brand brand-logo-only compact">
      <img class="sidebar-logo" [src]="logoPath" alt="Logo"/>
    </div>

    <button class="sidebar-close-btn" type="button" (click)="onCloseSidebar()">
      x
    </button>
  </div>

  <div class="brand brand-logo-only">
    <img class="sidebar-logo" [src]="logoPath" alt="Logo"/>
  </div>

  <nav class="sidebar-nav">
    <section>
      <p class="section-title">
        Menu
      </p>

      <ul class="nav-list">
        <li class="nav-item" *ngFor="let item of sidebarItems">
          <a
            class="nav-link"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            (click)="onCloseSidebar()"
          >
            <span>{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </section>
  </nav>

  <div class="sidebar-user-panel">
    <div class="sidebar-user-top">
      <div class="user-avatar small">
        {{ userName.charAt(0) }}
      </div>

      <div>
        <p class="sidebar-user-name">{{ userName }}</p>
        <p class="sidebar-user-role">{{ userRole }}</p>
      </div>
    </div>

    <div class="sidebar-user-actions">
      <a routerLink="/notifications" class="sidebar-action-link">
        <span>🔔</span>
        <span>Notifications</span>
        <strong *ngIf="notificationCount > 0">{{ notificationCount }}</strong>
      </a>

      <a routerLink="/profile" class="sidebar-action-link">
        <span>👤</span>
        <span>My Profile</span>
      </a>
    </div>
  </div>
</aside>

<div
  class="sidebar-backdrop"
  [class.show]="isOpen"
  (click)="onCloseSidebar()"
></div>
