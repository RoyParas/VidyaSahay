<aside class="sidebar" [class.sidebar-open]="isOpen">
  <div class="sidebar-mobile-header">
    <button class="sidebar-close-btn" type="button" (click)="onCloseSidebar()" aria-label="Close menu">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6 6l12 12M18 6 6 18"></path>
      </svg>
    </button>
  </div>

  <a class="brand brand-logo-only" routerLink="/" (click)="onCloseSidebar()" aria-label="Go to home page">
    <img class="sidebar-logo" [src]="logoPath" alt="VidyaSahay" />
  </a>

  <nav class="sidebar-nav">
    <section>
      <p class="section-title">
        Menu
      </p>

      <ul class="nav-list">
        <li class="nav-item" *ngFor="let item of sidebarItems">
          <a
            class="nav-link"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            (click)="onCloseSidebar()"
          >
            <span>{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </section>
  </nav>

  <div class="sidebar-user-panel" *ngIf="isLoggedIn">
    <div class="sidebar-user-top">
      <span class="user-avatar small user-avatar-button" aria-hidden="true">
        {{ userInitial }}
      </span>

      <div>
        <p class="sidebar-user-name">{{ userName }}</p>
        <p class="sidebar-user-role">{{ userRole }}</p>
      </div>
    </div>

    <div class="sidebar-user-actions">
      <button type="button" class="sidebar-action-link" (click)="logout()">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M10 17v-2H4V9h6V7l4 5-4 5Zm1 4h7a2 2 0 0 0 2-2v-4h-2v4h-7v2ZM18 5h-7V3h7a2 2 0 0 1 2 2v4h-2V5Z"></path>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </div>
</aside>

<div
  class="sidebar-backdrop"
  [class.show]="isOpen"
  (click)="onCloseSidebar()"
></div>
