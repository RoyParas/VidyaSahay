<app-common-table
  title="Loan schemes"
  subtitle="Loan Schemes available through registered banks."
  [columns]="columns"
  [rows]="rows"
  [loading]="loading"
  [emptyTitle]="errorMessage ? 'No loan schemes found' : 'Unable to load loan schemes'"
  [emptyMessage]="errorMessage || 'There are no loan schemes to display.'"
  [showIndex]="true"
  [actions]="actions"
  [showActions]="canUpdate"
  (rowClick)="onRowClick($event)"
  (actionClick)="onActionClick($event)"
></app-common-table>
