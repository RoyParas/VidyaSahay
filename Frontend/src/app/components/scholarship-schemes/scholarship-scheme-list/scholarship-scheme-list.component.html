<app-common-table
  title="Scholarship schemes"
  subtitle="Scholarships available to eligible students."
  [columns]="columns"
  [rows]="rows"
  [loading]="loading"
  [emptyTitle]="errorMessage
      ? 'Unable to load scholarship schemes'
      : 'No scholarship schemes found'"
  [emptyMessage]="errorMessage || 'There are no scholarship schemes to display.'"
  [showIndex]="true"
  [actions]="actions"
  [showActions]="canUpdate"
  (rowClick)="onRowClick($event)"
  (actionClick)="onActionClick($event)"
></app-common-table>
