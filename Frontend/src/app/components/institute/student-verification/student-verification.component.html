<main class="student-verification-page">
  <app-student-by-id
    [studentId]="studentId"
    (studentLoaded)="onStudentLoaded($event)">
  </app-student-by-id>

  <section class="information-section" *ngIf="student && !isVerified">
    <div class="section-header">
      <h2>Verification Decision</h2>
      <p>Enter remarks and select the appropriate verification action.</p>
    </div>

    <form class="verification-form" [formGroup]="verificationForm" novalidate>
      <div class="form-group">
        <label for="remark" class="form-label">Remarks <span class="required">*</span></label>
        <textarea id="remark" class="form-textarea" formControlName="remark"
          placeholder="Enter remarks for this verification decision..." maxlength="1000"
          [class.invalid]="remarkControl?.invalid && (remarkControl?.touched || submitted)"></textarea>
        <div class="remark-footer">
          <div>
            <span class="form-error" *ngIf="remarkControl?.errors && (remarkControl?.touched || submitted)">
              <span *ngIf="remarkControl?.errors?.['required']">Remark is required.</span>
              <span *ngIf="remarkControl?.errors?.['maxlength']">Remark cannot exceed 1000 characters.</span>
            </span>
            <span class="form-help" *ngIf="!remarkControl?.errors || (!remarkControl?.touched && !submitted)">
              Provide a clear reason before changing the verification status.
            </span>
          </div>
          <span class="character-count" [class.character-limit]="remarkLength >= 1000">{{ remarkLength }}/1000</span>
        </div>
      </div>

      <div class="verification-actions">
        <p class="action-label">Mark verification status</p>
        <div class="action-buttons">
          <button class="btn btn-success" type="button"
            [disabled]="updatingStatus || verificationForm.invalid" (click)="verifyStudent()">
            <span class="spinner" *ngIf="isUpdating(VerificationStatus.VERIFIED)"></span>
            {{ isUpdating(VerificationStatus.VERIFIED) ? 'Verifying...' : 'Verify' }}
          </button>
          <button class="btn btn-danger" type="button"
            [disabled]="updatingStatus || verificationForm.invalid" (click)="rejectStudent()">
            <span class="spinner" *ngIf="isUpdating(VerificationStatus.REJECTED)"></span>
            {{ isUpdating(VerificationStatus.REJECTED) ? 'Rejecting...' : 'Reject' }}
          </button>
        </div>
      </div>
    </form>
  </section>
</main>
